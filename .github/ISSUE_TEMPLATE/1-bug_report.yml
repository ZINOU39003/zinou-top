name: Bug report / بلاغ عن مشكلة
description: Report a problem in ZINOU TOP
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not post passwords, tokens or personal data.
        شكرًا لك. لا تنشر كلمات مرور أو رموز دخول أو بيانات شخصية.
  - type: input
    id: version
    attributes:
      label: ZINOU TOP version (About screen)
      placeholder: "1.0.0 (10000)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "e.g. Android TV box, Android 11, arm64-v8a"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback / quality / HDR
        - Search
        - Login / account
        - Subscriptions / history / playlists
        - Remote control / navigation
        - Update system
        - Other
    validations:
      required: true
