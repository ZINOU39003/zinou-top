name: ZINOU TOP Build

# Debug build + tests for every push / pull request. Uses NO secrets and NO signing key.

on:
  push:
    branches: [ "zinou", "main" ]
  pull_request:
    branches: [ "zinou", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zinou-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with SmartTube submodules)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Guard - no secrets in the repository
        run: |
          set -eu
          found=$(git ls-files | grep -iE '(^|/)keystore\.properties$|\.(jks|keystore|p12|pfx|pem)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Signing material must never be committed: $found"
            exit 1
          fi

      - name: Release tooling tests
        run: python3 scripts/release/test_make_release_assets.py

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: ZINOU unit tests (update.json validation, SHA-256)
        run: ./gradlew :common:testZinouDebugUnitTest --tests 'com.liskovsoft.smartyoutubetv2.common.zinou.*'

      - name: Build ZINOU TOP debug APKs
        run: ./gradlew assembleZinouDebug

      - name: Verify APK identity (package, name, providers)
        run: |
          set -eu
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK=$(find smarttubetv/build/outputs/apk/zinou/debug -name 'ZinouTop-v*-debug.apk' ! -name '*-v7a*' ! -name '*-v8a*' ! -name '*-x86*' | head -n 1)
          [ -n "$APK" ] || { echo "::error::universal debug APK not found"; exit 1; }
          BADGING=$("$BT/aapt" dump badging "$APK")
          XML=$("$BT/aapt" dump xmltree "$APK" AndroidManifest.xml)
          PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VER=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          LABEL=$(printf '%s\n' "$BADGING" | sed -n "s/^application-label:'\(.*\)'/\1/p")
          AUTH=$(printf '%s\n' "$XML" | grep 'android:authorities' | sed -E 's/.*="([^"]*)".*/\1/' | sort -u | tr '\n' ' ')
          {
            echo "### ZINOU TOP APK check"
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| APK | \`$(basename "$APK")\` ($(du -h "$APK" | cut -f1)) |"
            echo "| Package | \`$PKG\` |"
            echo "| Version | \`$VER\` |"
            echo "| Label | $LABEL |"
            echo "| Provider authorities | \`$AUTH\` |"
            echo "| APKs built | $(find smarttubetv/build/outputs/apk/zinou/debug -name '*.apk' -printf '%f ') |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$PKG" = "com.zinou.top" ] || { echo "::error::package is '$PKG', expected com.zinou.top"; exit 1; }
          [ "$LABEL" = "ZINOU TOP" ] || { echo "::error::app label is '$LABEL', expected ZINOU TOP"; exit 1; }
          if printf '%s' "$AUTH" | grep -qi 'smarttube'; then echo "::error::SmartTube provider authority in ZINOU APK: $AUTH"; exit 1; fi
          echo "APK identity OK: $PKG $VER '$LABEL' [$AUTH]"

      - name: Upload debug APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ZinouTop-debug-${{ github.run_number }}
          path: smarttubetv/build/outputs/apk/zinou/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zinou-test-reports-${{ github.run_number }}
          path: common/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
