# ZINOU TOP - project configuration (single source of truth). Contains NO secrets.
#
# GitHub repository that hosts ZINOU TOP releases. Used to build, at compile time:
#   GITHUB_OWNER       = github.owner
#   GITHUB_REPOSITORY  = github.repository
#   update manifest    = https://github.com/<owner>/<repository>/releases/latest/download/update.json
#   RELEASE_API_URL    = https://api.github.com/repos/<owner>/<repository>/releases/latest
#   GitHub link        = https://github.com/<owner>/<repository>
#
# While github.owner is YOUR_USERNAME the app contains NO update URL and NO GitHub link
# (update checks report "update source not configured"). Set your real GitHub username here.
github.owner=ZINOU39003
github.repository=zinou-top

# Upstream SmartTube commit this ZINOU TOP tree is based on (shown in About).
# Update it after every reviewed merge from upstream (see UPSTREAM.md).
upstream.commit=41fbc7c

# SHA-256 fingerprint of the ZINOU TOP release signing CERTIFICATE (public information, not a secret).
# Fill it once after creating your keystore (see SIGNING.md). Release tooling refuses to publish APKs
# signed with any other key. Format: 64 hex characters, colons optional.
release.cert.sha256=4D:A4:6B:44:6D:03:2F:39:9F:F8:8B:42:D8:D8:54:4E:E9:E5:CF:C1:54:B6:D9:FC:AB:21:38:53:0E:A5:81:70
